name: Print digest tick

# בודק כל שעה אם הגיע הזמן לשלוח את מייל ההדפסות השבועי (היום והשעה נקבעים באפליקציה: תכנון שיעורים -> מייל הדפסות).
# השרת מחליט אם לשלוח; כאן רק מדפקים עליו. מאומת בטוקן הפריסה (DEPLOY_TOKEN).
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    if: github.repository == 'chepti/talap'
    steps:
      - name: Ask the server to run the digest if due
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -u
          code=$(curl -sS -o resp.json -w '%{http_code}' --max-time 90 -X POST \
            -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
            "https://www.chepti.com/talap/backend/api/index.php?action=print_digest_tick") || code=000
          cat resp.json || true; echo
          [ "$code" = "200" ]
